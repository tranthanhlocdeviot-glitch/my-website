    <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trần Thành Lộc- Liên hệ| ĐH Gia Định</title>
</head>
<body>
    <header>
        <h1>Form liên hệ</h1>
        <nav>
            <a href="index.html">Trang chủ</a> 
            <a href="about.html">Giới thiệu</a>
        </nav>
    </header>
    <main>
         <form action="#" method="POST">
    <fieldset>
        <legend>Thông tin cá nhân</legend>
        
        <div>
            <label for="name">Họ và tên:</label>
            <input type="text" id="name" name="name" required minlength="2" placeholder="Nhập tên"
            pattern="[^0-9]*">
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="email@example.com">
        </div>

        <div>
            <label for="phone">Số điện thoại:</label>
            <input type="tel" id="phone" name="phone" required pattern="[0-9]{10,11}" placeholder="10 hoặc 11 chữ số">
        </div>
    <div>
        <label for="school">Trường ĐH: </label>
        <input list="school-list" id="school" name="school" required placeholder="Gõ tên trường...">
        <datalist id="school-list">
            <option value="IUH">
            <option value="GDU">
            <option value="HIU">
        </datalist>
    </div>
        <div>
            <label for="date">Ngày sinh</label>
            <input type="date" name="date" repuired>
        </div>
    </fieldset>

    <fieldset2>
        <legend>Nội dung liên hệ</legend>
        <div>
            <label for="subject">Kênh:</label>
            <select id="subject" name="subject" required>
                <option value="">-- Chọn kênh--</option>
                <option value="tu-van">Email</option>
                <option value="hop-tac">Phone</option>
                <option value="khac">Zalo</option>
            </select>
        </div>
        <div>
            <label for="message">Lời nhắn:</label>
            <textarea id="message" name="message" rows="4" required placeholder="nhập stk ở đây nha thầy"></textarea>
        </div>
        <div>
            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">Tôi đồng ý với các điều khoản sử dụng</label>
        </div>
    </fieldset2>
    <div style="margin-top: 15px;">
        <button type="submit">Gửi</button>
        <button type="reset">Xóa và nhập lại</button>
    </div>
</form>
    </main>

       <address> Hotline: 0335204127</address>
    </footer>
</body>
</html>
